[package]
name = "upload-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# 共享库
common = { path = "../shared/common" }
consul-client = { path = "../shared/consul-client" }
# 终端侧 MCP 客户端：把 cortex-mcp（Python）作为 stdio 子进程托管，承载记忆层
mcp-client = { path = "../shared/mcp-client" }

# Web框架
axum = { workspace = true, features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "limit"] }

# 异步运行时
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"

# 数据库
sea-orm = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 错误处理
anyhow = { workspace = true }
thiserror = "1.0"

# 时间
chrono = "0.4"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# 字节处理
bytes = "1.5"

# 文件类型检测
infer = "0.15"

# PDF解析
pdf-extract = "0.7"
lopdf = "0.32"

# DOCX解析
docx-rs = "0.4"
zip = "0.6"
quick-xml = "0.31"

# Excel解析
calamine = "0.24"

# HTML解析
scraper = "0.17"

# HTTP客户端（用于OSS和DeepSeek）
reqwest = { version = "0.11", features = ["json", "multipart"] }

# 环境变量
dotenv = "0.15"

# JWT
jsonwebtoken = "9.2"

# 密码加密
argon2 = "0.5"

# Hash计算
sha2 = "0.10"

# 验证
validator = { version = "0.16", features = ["derive"] }

# 正则表达式（用于JD解析）
regex = "1.10"
lazy_static = "1.4"

# LLM 抽象层（进程内 / 进程外 统一接口）
async-trait = "0.1"

# 本地 LLM 推理（进程内 GGUF，自主可控）
# ⚠️ 改为 optional feature `local-llm`，默认关闭 ——
#    llama_cpp_rs 0.3 的 build.rs 用 bindgen ⇒ 构建期必需 libclang（Windows 亦然，
#    且其 windows 分支不分 gnu/msvc、硬推 MSVC 旗标）。
#    默认关闭后本包与其 C++ 链接解绑，进程外模型服务（Ollama 协议）分支可单独编出二进制。
llama_cpp_rs = { version = "0.3", optional = true }
num_cpus = { version = "1.16", optional = true }
rand = "0.8"

[features]
default = []
# 启用进程内 GGUF 推理（需 libclang；本轮不编译）
local-llm = ["dep:llama_cpp_rs", "dep:num_cpus"]

[dev-dependencies]
# 路由测试用 oneshot
tower = { workspace = true }
