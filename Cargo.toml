[workspace]
members = [
    "api-gateway",
    "upload-service",
    "auth-service",
    "user-service",
    "jobfirst-slice-service",
    # Phase 2服务（2026-10-16 启用：以 genzltd_schema_v0.2.sql 为基准补齐缺口）
    "job-service",
    "resume-service",
    "application-service",
    "company-service",
    "shared/common",
    "shared/consul-client",
    "shared/service-auth",  # 服务间认证库
    "shared/mcp-client",    # 终端侧 MCP 客户端（托管 cortex-mcp 记忆层，stdio 子进程）
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ADIRP Team"]
license = "MIT"

[workspace.dependencies]
# Web框架
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "limit"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
# ⚠️ 2026-10-16：**追加** postgres feature（不替换 mysql），避免波及继承本项的服务
#    （upload-service / auth-service / user-service / shared/common 均已 sea-orm.workspace = true）
#    四服务（resume/job/application/company）连 genzltd（PostgreSQL 17 + pgvector）
#    sea-orm 0.12 支持多 driver feature 并存，成本仅为编译时间
sea-orm = { version = "0.12", features = ["sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sqlx = { version = "0.7", features = ["mysql", "postgres", "runtime-tokio-rustls", "json", "chrono"] }

# 认证
jsonwebtoken = "9.2"
bcrypt = "0.15"
argon2 = "0.5"

# 身份哈希（THOMAS 生态跨端关联键 email_hash = sha256(email)）
sha2 = "0.10"
hex = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# HTTP客户端
reqwest = { version = "0.11", features = ["json", "multipart"] }

# Redis
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }

# 验证
validator = { version = "0.16", features = ["derive"] }

# 配置
config = "0.13"
dotenvy = "0.15"

# 其他
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bytes = "1.0"

